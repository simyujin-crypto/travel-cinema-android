name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true
        with:
          cmdline-tools-version: '11.0'
          api-level: 34
          build-tools-version: '34.0.0'

      - name: Ensure SDK platform-34 and build-tools exist
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER=""
          for candidate in \
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_DIR/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK_DIR/cmdline-tools/12.0/bin/sdkmanager" \
            "$SDK_DIR/cmdline-tools/11.0/bin/sdkmanager" \
            "$SDK_DIR/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          fi

          if [ ! -d "$SDK_DIR/platforms/android-34" ]; then
            echo "android-34 플랫폼을 찾을 수 없습니다."
            exit 1
          fi

      - name: Generate Android app icons from travel-cinema.png
        run: |
          SRC_PNG=""
          for candidate in "travel-cinema.png" "app/src/main/res/drawable/travel-cinema.png" "app/travel-cinema.png"; do
            if [ -f "$candidate" ]; then
              SRC_PNG="$candidate"
              break
            fi
          done

          if [ -z "$SRC_PNG" ]; then
            echo "travel-cinema.png 파일을 찾을 수 없습니다."
            exit 1
          fi

          python3 -m pip install --break-system-packages --quiet Pillow || sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil || true

          python3 - "$SRC_PNG" << 'EOF'
          import os, shutil, sys

          src_path = sys.argv[1]
          base_res = "app/src/main/res"
          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for d in densities:
              shutil.rmtree(os.path.join(base_res, d), ignore_errors=True)

          try:
              from PIL import Image

              with Image.open(src_path) as im:
                  rgba = im.convert("RGBA")

                  for folder, px in densities.items():
                      out_dir = os.path.join(base_res, folder)
                      os.makedirs(out_dir, exist_ok=True)
                      icon = rgba.resize((px, px), Image.Resampling.LANCZOS)
                      icon.save(os.path.join(out_dir, "ic_launcher.png"), "PNG")
                      icon.save(os.path.join(out_dir, "ic_launcher_round.png"), "PNG")

                  fg_dir = os.path.join(base_res, "mipmap-xxxhdpi")
                  os.makedirs(fg_dir, exist_ok=True)
                  canvas_size = 432
                  safe_size = 284
                  fg_canvas = Image.new("RGBA", (canvas_size, canvas_size), (0, 0, 0, 0))
                  fitted = rgba.copy()
                  fitted.thumbnail((safe_size, safe_size), Image.Resampling.LANCZOS)
                  offset = ((canvas_size - fitted.width) // 2, (canvas_size - fitted.height) // 2)
                  fg_canvas.paste(fitted, offset, fitted)
                  fg_canvas.save(os.path.join(fg_dir, "ic_launcher_foreground.png"), "PNG")
          except ImportError:
              for folder in densities:
                  out_dir = os.path.join(base_res, folder)
                  os.makedirs(out_dir, exist_ok=True)
                  shutil.copy2(src_path, os.path.join(out_dir, "ic_launcher.png"))
                  shutil.copy2(src_path, os.path.join(out_dir, "ic_launcher_round.png"))
              fg_dir = os.path.join(base_res, "mipmap-xxxhdpi")
              os.makedirs(fg_dir, exist_ok=True)
              shutil.copy2(src_path, os.path.join(fg_dir, "ic_launcher_foreground.png"))
          EOF

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: travel-cinema-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk